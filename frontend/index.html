<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Override at deploy time (e.g. via a build step) if the API isn't same-origin. -->
    <meta name="api-base" content="http://localhost:8000" />
    <title>Audio Daily Digest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="blob blob-c"></div>
    </div>

    <main>
      <header>
        <h1>Audio Daily Digest</h1>
        <p id="date" class="date"></p>
      </header>

      <section id="state-loading" class="state">Digest wird geladen…</section>
      <section id="state-empty" class="state" hidden>
        Für heute wurde noch kein Digest erstellt.
      </section>
      <section id="state-error" class="state" hidden>
        Die Digest-API ist nicht erreichbar.
      </section>

      <section id="digest" hidden>
        <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
        <div class="player" id="player">
          <div class="player-row">
            <button id="play-toggle" class="play-btn" type="button" aria-label="Abspielen">
              <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20">
                <path d="M8 5v14l11-7z" fill="currentColor" />
              </svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" hidden>
                <path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" />
              </svg>
            </button>
            <div class="player-body">
              <div class="progress-track" id="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-handle" id="progress-handle"></div>
              </div>
              <div class="time-row">
                <span id="time-current">0:00</span>
                <span id="time-duration">0:00</span>
              </div>
            </div>
            <div class="volume">
              <button id="mute-toggle" class="mute-btn" type="button" aria-label="Stummschalten">
                <svg id="icon-volume" viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="M4 9v6h4l5 5V4L8 9H4z M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"
                    fill="currentColor"
                  />
                </svg>
                <svg id="icon-muted" viewBox="0 0 24 24" width="18" height="18" hidden>
                  <path
                    d="M4 9v6h4l5 5V4L8 9H4z M19 8l-4 4m0-4l4 4"
                    stroke="currentColor"
                    stroke-width="1.6"
                    fill="currentColor"
                  />
                </svg>
              </button>
              <input
                id="volume-slider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Lautstärke"
              />
            </div>
          </div>
          <canvas id="visualizer" class="visualizer" height="40"></canvas>
        </div>

        <div id="tag-filter" class="tag-filter" hidden></div>

        <article id="segments"></article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
