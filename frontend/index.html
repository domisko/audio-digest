<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Empty = same-origin (the default now that the frontend is served by the API
         container itself). Set to e.g. http://localhost:8000 only when serving this
         file separately during local frontend-only development. -->
    <meta name="api-base" content="" />
    <title>Audio Daily Digest</title>
    <link rel="stylesheet" href="style.css?v=9" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <div class="blob-wrap" id="blob-wrap-a" data-depth="0.4"><div class="blob blob-a"></div></div>
      <div class="blob-wrap" id="blob-wrap-b" data-depth="0.7"><div class="blob blob-b"></div></div>
      <div class="blob-wrap" id="blob-wrap-c" data-depth="0.55"><div class="blob blob-c"></div></div>
    </div>

    <main>
      <header>
        <div>
          <h1>Audio Daily Digest</h1>
          <p id="date" class="date"></p>
        </div>
        <a
          class="github-link"
          href="https://github.com/domisko/audio-digest"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Auf GitHub ansehen"
        >
          <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
              0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
              -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
              .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
              -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
              1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
              1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
              1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </header>

      <section id="state-loading" class="state">Digest wird geladen…</section>
      <section id="state-empty" class="state" hidden>
        Für heute wurde noch kein Digest erstellt.
      </section>
      <section id="state-error" class="state" hidden>
        Die Digest-API ist nicht erreichbar.
      </section>

      <section id="digest" hidden>
        <div class="player" id="player">
          <div class="player-row">
            <button id="play-toggle" class="play-btn" type="button" aria-label="Abspielen">
              <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20">
                <path d="M8 5v14l11-7z" fill="currentColor" />
              </svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" style="display: none">
                <path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" />
              </svg>
            </button>
            <div class="player-body">
              <div id="waveform"></div>
              <div class="time-row">
                <span id="time-current">0:00</span>
                <span id="time-duration">0:00</span>
              </div>
            </div>
          </div>

          <div class="controls-row">
            <div class="control-group">
              <button id="speed-toggle" class="speed-btn" type="button" aria-label="Wiedergabegeschwindigkeit">
                1×
              </button>
              <button
                id="cc-toggle"
                class="cc-btn"
                type="button"
                aria-label="Live-Untertitel"
                aria-pressed="false"
              >
                CC
              </button>
            </div>
            <div class="volume">
              <button id="mute-toggle" class="mute-btn" type="button" aria-label="Stummschalten">
                <svg id="icon-volume" viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="M4 9v6h4l5 5V4L8 9H4z M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"
                    fill="currentColor"
                  />
                </svg>
                <svg id="icon-muted" viewBox="0 0 24 24" width="18" height="18" style="display: none">
                  <path
                    d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63z M19.73 12c0 .94-.2 1.82-.55 2.63l1.51 1.51c.66-1.24 1.06-2.63 1.06-4.14 0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z M4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.8L19.73 21 21 19.73l-9-9L4.27 3z M12 4l-1.88 1.88L12 7.76V4z"
                    fill="currentColor"
                  />
                </svg>
              </button>
              <input
                id="volume-slider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Lautstärke"
              />
            </div>
          </div>

          <div id="caption-box" class="caption-box" hidden>
            <p id="caption-text"></p>
          </div>
        </div>

        <div id="tag-filter" class="tag-filter" hidden></div>

        <article id="segments"></article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
